<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Ambient Light Effect -->
  <circle cx="200" cy="130" r="100" fill="#38bdf8" opacity="0.08"/>

  <!-- Person Silhouette Illustration -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Torso -->
    <path d="M 120 270 Q 200 230 280 270 L 290 300 L 110 300 Z" fill="#475569"/>
    
    <!-- Neck -->
    <rect x="180" y="170" width="40" height="35" rx="6" fill="#cbd5e1"/>
    
    <!-- Head/Face -->
    <ellipse cx="200" cy="130" rx="50" ry="60" fill="url(#skinGrad)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Hair -->
    <path d="M 150 120 C 150 70, 250 70, 250 120 C 240 85, 160 85, 150 120 Z" fill="#334155"/>
    
    <!-- Eyes -->
    <ellipse cx="180" cy="125" rx="6" ry="4" fill="#0f172a"/>
    <ellipse cx="220" cy="125" rx="6" ry="4" fill="#0f172a"/>
    
    <!-- Eyebrows -->
    <path d="M 172 115 Q 180 110 188 115" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 212 115 Q 220 110 228 115" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Nose -->
    <path d="M 200 125 L 197 140 L 203 140" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Gentle Smile -->
    <path d="M 185 155 Q 200 165 215 155" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Oval Centered Face Guide Overlay -->
  <ellipse cx="200" cy="140" rx="75" ry="95" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Good Lighting Sparkles -->
  <path d="M 70 60 L 73 70 L 83 73 L 73 76 L 70 86 L 67 76 L 57 73 L 67 70 Z" fill="#fbbf24"/>
  <path d="M 320 70 L 322 77 L 329 79 L 322 81 L 320 88 L 318 81 L 311 79 L 318 77 Z" fill="#fbbf24"/>

  <!-- PASS / Good Selfie Badge -->
  <g transform="translate(290, 220)">
    <rect x="0" y="0" width="95" height="32" rx="16" fill="url(#badgeGrad)"/>
    <circle cx="18" cy="16" r="10" fill="#ffffff"/>
    <path d="M 13 16 L 17 20 L 23 12" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">PASSED</text>
  </g>
</svg>
